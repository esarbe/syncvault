[package]
name = "syncthing-custom"
version.workspace = true
edition = "2021"

publish = false

[[bin]]
name = "syncthing-custom"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
custom-protocol = { path = "../../crates/custom-protocol" }
hex = { workspace = true }
rand = { workspace = true }
rpassword = "7.3"
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = "1.1"
syncthing-core = { path = "../../crates/syncthing-core" }
syncthing-net = { path = "../../crates/syncthing-net" }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
vault-core = { path = "../../crates/vault-core" }
zeroize = "1.8"

[dev-dependencies]
